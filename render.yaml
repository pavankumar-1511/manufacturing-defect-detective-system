services:
  # 1. FastAPI Python AI Backend Web Service
  - type: web
    name: manufacturing-defect-detective-system
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./defect_detection.db
      - key: CORS_ORIGINS
        value: "*"

  # 2. React Vite Frontend Web Application (Total Website)
  - type: static
    name: manufacturing-defect-ui
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: manufacturing-defect-detective-system
          property: url
